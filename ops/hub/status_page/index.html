<title>baseline 상황판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column operations board — summary line, hub memo, then one row per cloud session. */
:root {
  --bg: #f3f4f6; --panel: #ffffff; --ink: #14181f; --muted: #5b6472; --line: #d9dde3;
  --accent: #1f5fbf; --ok: #1d7a46; --warn: #a15c00; --bad: #b3261e; --idle: #7a828e;
  --ok-bg: #e3f3ea; --warn-bg: #fbefdc; --bad-bg: #fbe4e2; --idle-bg: #eceef1; --bar: #e4e7eb;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1216; --panel: #171b21; --ink: #e7eaee; --muted: #9aa3ae; --line: #2a3038;
  --accent: #7fb0ff; --ok: #5fd08f; --warn: #f0b45a; --bad: #ff8a80; --idle: #8b939d;
  --ok-bg: #16301f; --warn-bg: #33270f; --bad-bg: #3a1714; --idle-bg: #20252c; --bar: #262c34; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1216; --panel: #171b21; --ink: #e7eaee; --muted: #9aa3ae; --line: #2a3038;
  --accent: #7fb0ff; --ok: #5fd08f; --warn: #f0b45a; --bad: #ff8a80; --idle: #8b939d;
  --ok-bg: #16301f; --warn-bg: #33270f; --bad-bg: #3a1714; --idle-bg: #20252c; --bar: #262c34; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 920px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 13px; font-weight: 600; margin: 0; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.meta { color: var(--muted); font-size: 13px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
button { font: inherit; font-size: 13px; color: var(--accent); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.summary { display: flex; flex-wrap: wrap; gap: 8px; }
.sum { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; display: flex; gap: 8px; align-items: baseline; }
.sum b { font-family: var(--mono); font-size: 18px; font-variant-numeric: tabular-nums; }
.sum span { color: var(--muted); font-size: 13px; }
section { display: grid; gap: 10px; }
.memo { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 10px; }
.memo ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.memo li { min-width: 0; overflow-wrap: anywhere; }
.kv { display: flex; flex-wrap: wrap; gap: 6px 16px; font-family: var(--mono); font-size: 13px; color: var(--muted); }
.kv b { color: var(--ink); font-weight: 500; }
.list { display: grid; gap: 8px; }
.row { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 6px; min-width: 0; }
.top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.title { font-weight: 500; min-width: 0; overflow-wrap: anywhere; flex: 1 1 240px; }
.title a { color: var(--ink); text-decoration: none; }
.title a:hover { text-decoration: underline; }
.chip { font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.s-working { color: var(--ok); background: var(--ok-bg); }
.s-review { color: var(--warn); background: var(--warn-bg); }
.s-blocked, .s-failed { color: var(--bad); background: var(--bad-bg); }
.s-idle { color: var(--idle); background: var(--idle-bg); }
.role { font-size: 12px; color: var(--muted); border: 1px solid var(--line); padding: 0 6px; border-radius: 4px; }
.detail { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.nums { display: flex; flex-wrap: wrap; gap: 4px 16px; font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; align-items: center; }
.ctx { display: inline-flex; gap: 6px; align-items: center; }
.bar { width: 90px; height: 6px; background: var(--bar); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.bar i.hot { background: var(--bad); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; }
@media (prefers-reduced-motion: no-preference) { .dot.live { animation: pulse 2s ease-in-out infinite; } }
@keyframes pulse { 50% { opacity: .35; } }
.note { color: var(--muted); font-size: 13px; background: var(--panel); border: 1px dashed var(--line); border-radius: 8px; padding: 12px 14px; }
details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
details .list { margin-top: 8px; }
</style>

<div class="wrap">
  <header>
    <h1>baseline 상황판</h1>
    <div class="meta"><span class="dot" id="dot"></span><span id="updated">불러오는 중…</span><button id="refresh" type="button">새로고침</button></div>
  </header>

  <div class="summary" id="summary" aria-live="polite">
    <div class="sum"><b id="n-working">–</b><span>작업 중</span></div>
    <div class="sum"><b id="n-review">–</b><span>검토 대기</span></div>
    <div class="sum"><b id="n-blocked">–</b><span>막힘 · 실패</span></div>
    <div class="sum"><b id="n-cost">–</b><span>활성 세션 비용</span></div>
  </div>

  <section aria-labelledby="h-memo">
    <h2 id="h-memo">허브 메모</h2>
    <div class="memo" id="memo"><div class="detail">허브가 메모를 쓰면 여기에 진행 중인 일, 저장소 머리, VM 상태가 나옵니다.</div></div>
  </section>

  <section aria-labelledby="h-active">
    <h2 id="h-active">클라우드 세션 · 활성</h2>
    <div class="list" id="active"><div class="note" id="mcp-note">세션 목록을 불러오는 중입니다. 처음 열 때 claude.ai 가 Claude Code Remote 연결 사용을 물어봅니다.</div></div>
  </section>

  <section aria-labelledby="h-rest">
    <details id="rest-wrap">
      <summary id="h-rest">끝났거나 쉬는 세션</summary>
      <div class="list" id="rest"></div>
    </details>
  </section>
</div>

<script>
(function () {
  const SERVER = "Claude Code Remote";
  const $ = (id) => document.getElementById(id);
  const kst = new Intl.DateTimeFormat("ko-KR", { timeZone: "Asia/Seoul", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false });
  const fmt = (t) => { try { return kst.format(new Date(t)) + " KST"; } catch (e) { return String(t); } };
  function ago(t) {
    const s = Math.max(0, (Date.now() - new Date(t).getTime()) / 1000);
    if (!isFinite(s)) return "";
    if (s < 60) return "방금";
    if (s < 3600) return Math.floor(s / 60) + "분 전";
    if (s < 86400) return Math.floor(s / 3600) + "시간 전";
    return Math.floor(s / 86400) + "일 전";
  }
  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function bucket(s) {
    const b = String(s.status_bucket || "").replace("SESSION_STATUS_BUCKET_", "").toLowerCase();
    if (b === "working") return ["working", "작업 중"];
    if (b === "review_ready") return ["review", "검토 대기"];
    if (b === "blocked") return ["blocked", "막힘"];
    if (b === "failed") return ["failed", "실패"];
    if (b === "completed") return ["idle", "끝남"];
    const st = String(s.session_status || "").replace("SESSION_STATUS_", "").toLowerCase();
    if (st === "running") return ["working", "작업 중"];
    return ["idle", st === "archived" ? "보관됨" : "쉼"];
  }
  function role(s) {
    const tags = s.tags || [], t = s.title || "";
    if (t.indexOf("현재 허브") >= 0) return "허브";
    if (t.indexOf("이전 허브") >= 0) return "이전 허브";
    if (tags.indexOf("baseline-integrator") >= 0 || t.indexOf("◇") >= 0) return "통합";
    if (t.indexOf("◎") >= 0) return "감시";
    if (tags.indexOf("baseline-worker") >= 0) return "작업";
    return "";
  }
  function repo(s) {
    try { const u = s.session_context.sources[0].git_repository.url; return u.split("/").pop(); } catch (e) { return ""; }
  }

  function row(s) {
    const [cls, label] = bucket(s);
    const em = s.external_metadata || {};
    const pts = s.post_turn_summary || em.post_turn_summary || {};
    const r = el("div", "row");
    const top = el("div", "top");
    const title = el("div", "title");
    const a = el("a", null, s.title || s.id);
    a.href = "https://claude.ai/code/" + encodeURIComponent(s.id);
    a.target = "_blank"; a.rel = "noopener";
    title.appendChild(a);
    top.appendChild(title);
    const rl = role(s); if (rl) top.appendChild(el("span", "role", rl));
    top.appendChild(el("span", "chip s-" + cls, label));
    r.appendChild(top);
    const d = pts.status_detail || s.task_summary || em.task_summary || "";
    if (d) r.appendChild(el("div", "detail", d));
    const nums = el("div", "nums");
    const cu = em.context_usage || {};
    if (cu.used_tokens != null) {
      const c = el("span", "ctx");
      c.appendChild(el("span", null, "문맥 " + Math.round(cu.used_tokens / 1000) + "k"));
      const bar = el("span", "bar"), i = el("i", cu.used_tokens > 150000 ? "hot" : "");
      i.style.width = Math.min(100, (cu.used_tokens / 200000) * 100) + "%";
      bar.appendChild(i); c.appendChild(bar); nums.appendChild(c);
    }
    const u = em.usage || {};
    if (u.cost_usd != null) nums.appendChild(el("span", null, "$" + Number(u.cost_usd).toFixed(2)));
    const m = em.last_served_model || (s.session_context || {}).model;
    if (m) nums.appendChild(el("span", null, m));
    const rp = repo(s); if (rp) nums.appendChild(el("span", null, rp));
    if (s.updated_at) nums.appendChild(el("span", null, ago(s.updated_at)));
    r.appendChild(nums);
    return r;
  }

  function renderSessions(list, storedAt) {
    const active = [], rest = [];
    let w = 0, rv = 0, bl = 0, cost = 0;
    list.sort((x, y) => String(y.updated_at).localeCompare(String(x.updated_at)));
    for (const s of list) {
      const [cls] = bucket(s);
      const live = cls !== "idle";
      if (cls === "working") w++; else if (cls === "review") rv++; else if (cls === "blocked" || cls === "failed") bl++;
      if (live) { active.push(s); cost += Number(((s.external_metadata || {}).usage || {}).cost_usd || 0); }
      else rest.push(s);
    }
    $("n-working").textContent = w; $("n-review").textContent = rv; $("n-blocked").textContent = bl;
    $("n-cost").textContent = "$" + cost.toFixed(2);
    const A = $("active"); A.replaceChildren();
    if (!active.length) A.appendChild(el("div", "note", "지금 활성 세션이 없습니다."));
    for (const s of active) A.appendChild(row(s));
    const R = $("rest"); R.replaceChildren();
    for (const s of rest) R.appendChild(row(s));
    $("h-rest").textContent = "끝났거나 쉬는 세션 (" + rest.length + ")";
    $("updated").textContent = "세션 " + fmt(storedAt || Date.now()) + " 기준";
    $("dot").classList.add("live");
  }

  function sessionsFrom(payload) {
    let p = payload;
    if (typeof p === "string") { try { p = JSON.parse(p); } catch (e) { return null; } }
    if (p && p.ccr) p = p.ccr;
    if (p && Array.isArray(p.data)) return p.data;
    if (Array.isArray(p)) return p;
    return null;
  }

  function mcpNote(text) {
    const A = $("active"); A.replaceChildren(el("div", "note", text));
    $("dot").classList.remove("live");
  }
  const ERR = {
    server_not_connected: "Claude Code Remote 연결이 없습니다. claude.ai 설정 → 커넥터에서 추가하면 세션이 보입니다.",
    needs_reauth: "Claude Code Remote 연결이 만료됐습니다. claude.ai 설정 → 커넥터에서 다시 연결해 주세요.",
    not_in_manifest: "이 페이지에서 세션 목록 읽기를 허용하지 않았습니다. 페이지 메뉴의 권한에서 켤 수 있습니다.",
    selection_required: "같은 이름의 연결이 여러 개입니다. 뜨는 안내에서 하나를 골라 주세요.",
    blocked_by_policy: "조직 정책이 세션 목록 읽기를 막고 있습니다.",
    not_granted: "이 화면에서는 세션 목록을 읽을 수 없습니다. claude.ai 에 로그인한 상태로 열어 주세요.",
    capability_disabled: "이 화면에서는 세션 목록을 읽을 수 없습니다. claude.ai 에 로그인한 상태로 열어 주세요."
  };
  const RETRACT = { needs_reauth: 1, server_not_connected: 1, blocked_by_policy: 1, approval_required: 1, not_in_manifest: 1 };

  let unwatch = null, mcpRef = null, haveData = false;
  function watch() {
    if (!mcpRef) return;
    if (unwatch) unwatch();
    unwatch = mcpRef.watchTool(SERVER, "list_sessions", { limit: 40 }, (ev) => {
      if (ev.type === "data") {
        const list = sessionsFrom(ev.result.payload);
        if (!list) { mcpNote("세션 목록의 모양을 읽지 못했습니다. 허브에 알려 주세요."); return; }
        haveData = true;
        renderSessions(list, ev.result.cache ? ev.result.cache.storedAt : null);
      } else {
        const c = ev.error && ev.error.code;
        if (RETRACT[c] || !haveData) mcpNote(ERR[c] || ("세션 목록을 읽지 못했습니다 (" + c + "). 잠시 뒤 새로고침해 주세요."));
        else $("updated").textContent = "갱신 실패 · 마지막 값 표시 중";
      }
    }, { refetchInterval: 60000 });
  }
  $("refresh").addEventListener("click", () => {
    if (mcpRef && mcpRef.invalidate) mcpRef.invalidate(SERVER, "list_sessions").catch(() => {}).then(watch);
  });

  function renderMemo(d) {
    const M = $("memo"); M.replaceChildren();
    if (!d) { M.appendChild(el("div", "detail", "아직 허브 메모가 없습니다.")); return; }
    if (d.headline) M.appendChild(el("div", null, d.headline));
    if (Array.isArray(d.in_flight) && d.in_flight.length) {
      const ul = el("ul");
      for (const it of d.in_flight) {
        const li = el("li");
        li.appendChild(el("b", null, String(it.id || "")));
        li.appendChild(document.createTextNode(" · " + String(it.state || "") + (it.note ? " — " + it.note : "")));
        ul.appendChild(li);
      }
      M.appendChild(ul);
    }
    const kv = el("div", "kv");
    const heads = d.heads || {};
    for (const k of Object.keys(heads)) { const s = el("span", null, k + " "); s.appendChild(el("b", null, String(heads[k]))); kv.appendChild(s); }
    if (d.vm) { const s = el("span", null, "VM "); s.appendChild(el("b", null, String(d.vm))); kv.appendChild(s); }
    if (kv.childNodes.length) M.appendChild(kv);
    if (d.at) M.appendChild(el("div", "detail", "허브 메모 " + fmt(d.at) + " (" + ago(d.at) + ")"));
  }

  claude.use("db").then((db) => {
    if (!db) { renderMemo(null); return; }
    db.doc("hub/status").onSnapshot((snap) => {
      const d = snap && (typeof snap.data === "function" ? snap.data() : snap.data);
      renderMemo(d || null);
    }, () => renderMemo(null));
  }).catch(() => renderMemo(null));

  claude.use("mcp").then((mcp) => {
    if (!mcp) { mcpNote(ERR.not_granted); return; }
    mcpRef = mcp; watch();
  }).catch(() => mcpNote(ERR.not_granted));

})();
</script>
