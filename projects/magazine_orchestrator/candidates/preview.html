<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;500;600&family=Cabin:wght@400;600&family=Cormorant:ital,wght@0,300;1,300&family=Crimson+Pro:wght@300;400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Fraunces:opsz,wght@9..144,300;9..144,900&family=Inter+Tight:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&family=Libre+Baskerville:wght@400;700&family=Libre+Franklin:wght@400;600;800&family=Noto+Sans+KR:wght@300;400;500;700;900&family=Noto+Serif+KR:wght@300;400;600;900&display=swap">
<style>
/* Layout: a contact sheet of seven printed pages on a light-table; each page keeps its own fixed print palette, the sheet follows the viewer's theme. */
:root {
  --bg: #e9e7e3; --fg: #1d1f22; --muted: #5d6166; --line: #c9c6c0;
  --sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --serif: "Noto Serif KR", "AppleMyungjo", "Batang", serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1b1c1e; --fg: #e8e6e2; --muted: #a2a5aa; --line: #393b3f; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #1b1c1e; --fg: #e8e6e2; --muted: #a2a5aa; --line: #393b3f; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); margin: 0; padding-inline: 16px; padding-block: 32px 64px }
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 28px }
header { display: grid; gap: 8px; max-width: 72ch }
header h1 { font-size: clamp(22px, 3vw, 30px); margin: 0; font-weight: 700; text-wrap: balance }
header p { margin: 0; color: var(--muted); line-height: 1.6; font-size: 14px }
.sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 36px 28px; align-items: start }
figure { margin: 0; display: grid; gap: 12px; min-width: 0 }
figcaption { display: grid; gap: 4px; font-size: 13px; line-height: 1.5 }
figcaption b { font-size: 15px }
figcaption span { color: var(--muted) }
.chips { display: flex; gap: 6px; align-items: center; flex-wrap: wrap }
.sw { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--line) }
.tag { font-family: var(--mono); font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 1px 6px }

.page { position: relative; width: 100%; max-width: 100%; aspect-ratio: 210 / 297; container-type: inline-size; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 10px 28px rgba(0,0,0,.14) }
.ph { font-family: var(--mono); font-size: 2cqw; letter-spacing: .05em }

/* 1 SYNTAX — 12 columns, fixed metadata rail on the left */
.syntax { background: #F7F7F5; color: #0E0E10; font-family: "Inter Tight", var(--sans); display: grid; grid-template-columns: 30cqw 1fr; }
.syntax .rail { background: #0E0E10; color: #D7D7D2; padding: 6cqw 3.5cqw; font-family: var(--mono); font-size: 1.85cqw; line-height: 1.6; display: grid; align-content: start; gap: 4cqw }
.syntax .rail h4 { margin: 0 0 1cqw; font-size: 1.6cqw; color: #7CFF9B; font-weight: 500; letter-spacing: .1em }
.syntax .rail pre { margin: 0; white-space: pre-wrap; font: inherit }
.syntax .rail .k { color: #8a8a86 }
.syntax .main { padding: 6cqw 5cqw 6cqw 4.5cqw; position: relative; background-image: repeating-linear-gradient(90deg, transparent 0 calc(100%/8 - .1cqw), rgba(14,14,16,.06) calc(100%/8 - .1cqw) calc(100%/8)) }
.syntax .eyebrow { font-family: var(--mono); font-size: 1.8cqw; letter-spacing: .12em }
.syntax h3 { font-size: 8cqw; font-weight: 800; letter-spacing: -.04em; line-height: .98; margin: 3cqw 0 3cqw; font-family: "Inter Tight", var(--sans) }
.syntax p { font-family: "Inter Tight", var(--sans); font-size: 2.35cqw; line-height: 1.6; margin: 0 0 2cqw }
.syntax svg { display: block; width: 100%; height: auto; margin: 3cqw 0 }
.syntax .folio { position: absolute; bottom: 4cqw; left: 4.5cqw; right: 5cqw; display: flex; justify-content: space-between; font-family: var(--mono); font-size: 1.7cqw }

/* 2 EMPTY — one text block, leading 190 %; image 42x46 % + text 40x20 % of the page = 27 % framed, plus mast and folio lines */
.empty { background: #F4F2EE; color: #262523; font-family: "Crimson Pro", var(--serif) }
.empty .img { position: absolute; left: 46%; top: 12%; width: 42%; height: 46%; background: radial-gradient(ellipse 30% 9% at 50% 82%, rgba(0,0,0,.18), transparent 70%), linear-gradient(180deg, #dcd7cf 0 70%, #cfc8bd 70%) }
.empty .img::after { content: ""; position: absolute; left: 38%; bottom: 18%; width: 24%; height: 34%; border-radius: 48% 48% 10% 10% / 30% 30% 8% 8%; background: linear-gradient(90deg, #a79d8f, #c7bfb3 60%, #b2a89a) }
.empty .img span { position: absolute; left: 3cqw; top: 3cqw; color: #8c857a }
.empty .txt { position: absolute; left: 12%; top: 66%; width: 40%; height: 20%; font-size: 2.45cqw; line-height: 1.9; font-weight: 300 }
.empty .txt q { display: block; font-family: "Cormorant", var(--serif); font-style: italic; font-size: 3.6cqw; line-height: 1.5; margin-bottom: 2cqw; quotes: none }
.empty .mast { position: absolute; left: 12%; top: 12%; font-family: "Cormorant", var(--serif); font-weight: 300; font-size: 3cqw; letter-spacing: .5em }
.empty .meta { position: absolute; left: 12%; bottom: 5%; right: 12%; display: flex; justify-content: space-between; font-family: var(--sans); font-size: 1.6cqw; letter-spacing: .2em; color: #8c857a }

/* 3 STRATUM — 6 columns, section + map + coordinate rail */
.stratum { background: #EEF0EE; color: #15191C; font-family: "Barlow", var(--sans); display: grid; grid-template-columns: 1fr 24cqw; }
.stratum .body { padding: 5cqw 3cqw 5cqw 5cqw; display: grid; gap: 2.5cqw; align-content: start }
.stratum .eyebrow { font-family: "Barlow Condensed", var(--sans); font-weight: 700; font-size: 2.2cqw; letter-spacing: .2em; color: #E2541B }
.stratum h3 { margin: 0; font-family: "Barlow Condensed", var(--sans); font-weight: 700; font-size: 9cqw; line-height: .95; letter-spacing: -.01em; text-transform: uppercase }
.stratum h3 small { display: block; font-family: var(--sans); font-weight: 500; font-size: 3.6cqw; letter-spacing: 0; text-transform: none; margin-top: 1.2cqw }
.stratum .map { position: relative; height: 40cqw; background:
  repeating-linear-gradient(0deg, transparent 0 5cqw, rgba(21,25,28,.08) 5cqw calc(5cqw + 1px)),
  repeating-linear-gradient(90deg, transparent 0 5cqw, rgba(21,25,28,.08) 5cqw calc(5cqw + 1px)),
  radial-gradient(ellipse 60% 40% at 30% 60%, #c9d2c8, transparent 70%),
  linear-gradient(160deg, #d6dbd3, #bfc8c2) }
.stratum .map .river { position: absolute; left: -5%; right: -5%; top: 62%; height: 4cqw; background: #8fb3c4; transform: rotate(-8deg); border-radius: 2cqw }
.stratum .pin { position: absolute; width: 2.6cqw; height: 2.6cqw; border-radius: 50%; background: #E2541B; border: .5cqw solid #fff; font-family: "Barlow Condensed", var(--sans); }
.stratum .pin b { position: absolute; left: 3.2cqw; top: -.6cqw; font-size: 2.2cqw; font-weight: 700; color: #15191C }
.stratum .map .ph { position: absolute; right: 2cqw; bottom: 1.5cqw; color: #4b5459 }
.stratum svg { display: block; width: 100%; height: auto }
.stratum p { margin: 0; font-size: 2.2cqw; line-height: 1.6 }
.stratum p sup { color: #E2541B; font-weight: 600 }
.stratum .rail { border-left: .25cqw solid #15191C; padding: 5cqw 3cqw; font-size: 1.85cqw; line-height: 1.5; display: grid; gap: 3cqw; align-content: start; background: #E4E7E4 }
.stratum .rail h4 { margin: 0; font-family: "Barlow Condensed", var(--sans); font-size: 2.2cqw; letter-spacing: .15em }
.stratum .rail .c { font-family: var(--mono); font-size: 1.7cqw; font-variant-numeric: tabular-nums }
.stratum .rail .c b { color: #E2541B }
.stratum .folio { position: absolute; bottom: 3.5cqw; left: 5cqw; font-family: "Barlow Condensed", var(--sans); font-size: 2cqw; letter-spacing: .2em }

/* 4 NEO-AVANT — broken grid over a full-bleed image, wrap and blend */
.avant { background: #0A0A0A; color: #F2F2F2; font-family: "Fraunces", var(--serif) }
.avant .bleed { position: absolute; inset: 0; background:
  radial-gradient(circle at 62% 40%, #cfd3d6 0 9%, #6d7378 18%, transparent 34%),
  radial-gradient(ellipse 22% 48% at 64% 74%, #2a2d30 0 60%, transparent 62%),
  conic-gradient(from 200deg at 70% 30%, #1a1a1a, #3c3f42, #121212, #5a5e62, #1a1a1a);
  filter: contrast(1.3) }
.avant .bleed .ph { position: absolute; right: 4cqw; top: 4cqw; color: #9aa0a5 }
.avant h3 { position: absolute; left: -2cqw; top: 8cqw; margin: 0; font-weight: 900; font-size: 21cqw; line-height: .8; letter-spacing: -.06em; transform: scaleX(.78) scaleY(1.25); transform-origin: left top; mix-blend-mode: difference; color: #fff; font-variation-settings: "opsz" 144 }
.avant .ko { position: absolute; left: 6cqw; top: 66cqw; font-family: var(--serif); font-weight: 900; font-size: 6cqw; writing-mode: vertical-rl; letter-spacing: .1em; mix-blend-mode: difference; color: #fff }
.avant .wrap-text { position: absolute; left: 16cqw; right: 6cqw; bottom: 8cqw; font-family: var(--sans); font-size: 2.3cqw; line-height: 1.6; color: #e9e9e9 }
.avant .wrap-text .float { float: right; width: 34cqw; height: 34cqw; shape-outside: circle(50%); border-radius: 50%; margin: 0 0 1cqw 3cqw; border: .3cqw dashed rgba(255,255,255,.5) }
.avant .wrap-text p { margin: 0 0 1.4cqw }
.avant .box { position: absolute; left: 44cqw; top: 46cqw; background: #E6FF00; color: #0A0A0A; font-family: var(--mono); font-size: 1.8cqw; padding: 1.5cqw 2.5cqw; transform: rotate(-4deg) }

/* 5 METRIC — 5 columns, stat callouts, table */
.metric { background: #FBFAF7; color: #1B1B1B; font-family: Georgia, "Noto Serif KR", serif; padding: 5cqw }
.metric .top { display: flex; justify-content: space-between; align-items: baseline; border-bottom: .5cqw solid #1B1B1B; padding-bottom: 1.2cqw; font-family: "Libre Franklin", var(--sans) }
.metric .top b { font-weight: 800; font-size: 5cqw; letter-spacing: -.02em }
.metric .top span { font-size: 1.8cqw; letter-spacing: .1em }
.metric h3 { margin: 3cqw 0 1cqw; font-size: 6.2cqw; line-height: 1.1; font-weight: 400 }
.metric .dek { margin: 0 0 3cqw; font-size: 2.5cqw; line-height: 1.5; font-style: italic; color: #444 }
.metric .stats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: .15cqw solid #1B1B1B; border-bottom: .15cqw solid #1B1B1B }
.metric .stat { padding: 2.5cqw 2cqw; border-right: .15cqw solid #ccc; font-family: "Libre Franklin", var(--sans); font-size: 1.9cqw; line-height: 1.4 }
.metric .stat:last-child { border-right: 0 }
.metric .stat b { display: block; font-family: Georgia, serif; font-weight: 400; font-size: 8cqw; line-height: 1; color: #0F5C4D; font-variant-numeric: tabular-nums }
.metric .cols { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2.4cqw; margin-top: 3cqw }
.metric .cols p { grid-column: span 2; margin: 0; font-size: 2.15cqw; line-height: 1.55 }
.metric table { grid-column: span 3; border-collapse: collapse; width: 100%; font-family: "Libre Franklin", var(--sans); font-size: 1.95cqw; font-variant-numeric: tabular-nums }
.metric th { text-align: left; border-bottom: .2cqw solid #1B1B1B; padding: .8cqw .4cqw; font-weight: 600 }
.metric td { border-bottom: .1cqw solid #ddd; padding: .8cqw .4cqw }
.metric td:not(:first-child), .metric th:not(:first-child) { text-align: right }
.metric .src { margin-top: 2cqw; font-family: "Libre Franklin", var(--sans); font-size: 1.7cqw; color: #B23A2E }

/* 6 TERRAFORM — golden-ratio modules, earth swatches, micro caption */
.terra { background: #F1EBDD; color: #2F2A22; font-family: "Cabin", var(--sans); display: grid; grid-template-columns: 61.8% 38.2%; grid-template-rows: 61.8% 38.2% }
.terra .hero { position: relative; background: radial-gradient(circle at 35% 40%, #e8dfcc 0 6%, transparent 7%), radial-gradient(circle at 60% 55%, #d9cdb4 0 4%, transparent 5%), repeating-radial-gradient(circle at 45% 50%, #b9a682 0 .6cqw, #c8b893 .6cqw 1.4cqw, #a8946d 1.4cqw 1.8cqw); }
.terra .hero::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, transparent 55%, #2F2A22 56%) }
.terra .hero .ph { position: absolute; left: 3cqw; bottom: 3cqw; color: #F1EBDD; z-index: 1 }
.terra .hero .mag { position: absolute; right: 3cqw; top: 3cqw; z-index: 1; font-family: var(--mono); font-size: 1.8cqw; color: #F1EBDD; text-align: right; line-height: 1.5 }
.terra .side { padding: 5cqw 4cqw; display: grid; align-content: start; gap: 2cqw }
.terra .eyebrow { font-size: 1.9cqw; letter-spacing: .2em; color: #6E7D4F; font-weight: 600 }
.terra h3 { margin: 0; font-family: "Libre Baskerville", var(--serif); font-weight: 400; font-size: 5.4cqw; line-height: 1.15 }
.terra .side p { margin: 0; font-size: 2.1cqw; line-height: 1.6 }
.terra .low { grid-column: 1 / -1; display: grid; grid-template-columns: 61.8% 38.2% }
.terra .low .text { padding: 4cqw 4cqw 4cqw 5cqw; columns: 2; column-gap: 3cqw; font-size: 2.05cqw; line-height: 1.6 }
.terra .low .text p { margin: 0 0 1.4cqw }
.terra .spec { background: #E3D8C1; padding: 4cqw; font-size: 1.9cqw; line-height: 1.6; display: grid; gap: 1.6cqw; align-content: start }
.terra .spec h4 { margin: 0; font-size: 2.1cqw; letter-spacing: .12em }
.terra .spec dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: .4cqw 2cqw }
.terra .spec dt { color: #6b5f4c }
.terra .spec dd { margin: 0; font-variant-numeric: tabular-nums }
.terra .sws { display: flex; gap: 1cqw }
.terra .sws i { width: 5cqw; height: 5cqw; border-radius: 50% }
.terra .tag2 { display: inline-block; border: .2cqw solid #6E7D4F; color: #6E7D4F; border-radius: 4cqw; padding: .2cqw 1.6cqw; font-size: 1.7cqw }

/* 7 KERNING — 8 pt baseline grid shown, kerning and tracking values exposed */
.kern { background: #FFFDF7; color: #1A1712; font-family: "EB Garamond", var(--serif); padding: 6cqw 6cqw 0;
  background-image: repeating-linear-gradient(180deg, transparent 0 calc(2.6cqw - 1px), rgba(0,120,200,.16) calc(2.6cqw - 1px) 2.6cqw) }
.kern .top { display: flex; justify-content: space-between; font-family: "EB Garamond", serif; font-variant: small-caps; letter-spacing: .12em; font-size: 2.4cqw; border-bottom: .15cqw solid #1A1712; padding-bottom: 1cqw }
.kern .spec { display: grid; grid-template-columns: 1fr 1fr; gap: 4cqw; margin-top: 5cqw; align-items: end }
.kern .pair { font-size: 24cqw; line-height: .9; position: relative }
.kern .pair.tight { letter-spacing: -.08em }
.kern .pair small { position: absolute; left: 0; bottom: -4cqw; font-family: var(--mono); font-size: 1.8cqw; color: #C0392B; letter-spacing: 0 }
.kern .pair.bask { font-family: "Libre Baskerville", serif }
.kern h3 { font-size: 6.6cqw; font-weight: 400; line-height: 1.15; margin: 8cqw 0 2cqw; text-wrap: balance }
.kern h3 em { font-variant-ligatures: discretionary-ligatures }
.kern p { font-size: 2.6cqw; line-height: 5.2cqw; margin: 0; text-align: justify; hyphens: auto; columns: 2; column-gap: 4cqw }
.kern p .sc { font-variant: small-caps; letter-spacing: .05em }
.kern p .lig { color: #C0392B }
.kern .proof { position: absolute; right: 2cqw; top: 58cqw; width: 14cqw; font-family: var(--mono); font-size: 1.6cqw; color: #C0392B; line-height: 1.5; border-left: .2cqw solid #C0392B; padding-left: 1.2cqw }
.kern .meter { position: absolute; left: 6cqw; right: 6cqw; bottom: 4cqw; display: flex; justify-content: space-between; font-family: var(--mono); font-size: 1.7cqw; color: #6a6052 }

@media (prefers-reduced-motion: no-preference) { .page { transition: transform .25s ease } figure:hover .page { transform: translateY(-3px) } }
</style>

  <header>
    <h1>매거진 후보 7종, 한 페이지씩</h1>
    <p>보내 주신 후보로 다시 만든 느낌 확인용 목업입니다. 실제 InDesign 출력이 아니고, 사진과 지도는 도형으로 만든 자리표시입니다. 5번 METRIC의 수치와 3번 STRATUM의 좌표는 예시입니다. 명세의 상용 글꼴은 이 페이지에서 비슷한 무료 글꼴로 대신했습니다(각 캡션에 적음).</p>
  </header>

  <div class="sheet">

    <figure>
      <div class="page syntax" aria-label="SYNTAX 기사 지면 목업">
        <aside class="rail">
          <div><h4>FRONTMATTER</h4><pre><span class="k">id:</span> SYN-0112
<span class="k">model:</span> diffusion-u-net
<span class="k">params:</span> 860M
<span class="k">steps:</span> 30</pre></div>
          <div><h4>PROMPT</h4><pre>"a lattice of light
folding into itself,
isometric, 35mm"</pre></div>
          <div><h4>CODE</h4><pre><span class="k">for</span> t <span class="k">in</span> steps:
  x = denoise(x, t)
<span class="k">return</span> decode(x)</pre></div>
        </aside>
        <div class="main">
          <div class="eyebrow">ARCHITECTURE / 03</div>
          <h3>노이즈에서 형태로</h3>
          <p>확산 모델은 그림을 그리지 않는다. 잡음을 조금씩 걷어 내며, 남은 것이 형태가 될 때까지 같은 계산을 되풀이한다.</p>
          <svg viewBox="0 0 200 70" role="img" aria-label="파이프라인 다이어그램">
            <rect x="2" y="20" width="40" height="30" fill="none" stroke="#0E0E10" stroke-width="1"/>
            <rect x="80" y="20" width="40" height="30" fill="#0E0E10"/>

            <text x="22" y="38" text-anchor="middle" font-size="7" fill="#0E0E10" font-family="JetBrains Mono, monospace">noise</text>
            <text x="100" y="38" text-anchor="middle" font-size="7" fill="#7CFF9B" font-family="JetBrains Mono, monospace">U-Net ×30</text>
            <text x="178" y="38" text-anchor="middle" font-size="7" fill="#0E0E10" font-family="JetBrains Mono, monospace">image</text>
          </svg>
          <p>왼쪽 열의 값은 본문과 따로 흐른다. 원고의 frontmatter와 코드 블록이 그대로 이 열의 오브젝트 스타일로 들어간다.</p>
          <div class="folio"><span>SYNTAX · VOL. 01</span><span>22</span></div>

      <figcaption><b>1 · SYNTAX</b><span>기사 지면 · 12컬럼, 좌측 메타데이터 열 · Inter Tight(대신: Neue Haas) + JetBrains Mono</span>
        <div class="chips"><i class="sw" style="background:#F7F7F5"></i><i class="sw" style="background:#0E0E10"></i><i class="sw" style="background:#7CFF9B"></i><span class="tag">code_block → 오브젝트 스타일</span></div></figcaption>

    <figure>
      <div class="page empty" aria-label="EMPTY 에세이 지면 목업">
        <div class="mast">EMPTY</div>
